<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lector · Joel Ortega Juárez</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0c0c0c">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/lector.css">
</head>
<body class="tema-claro">
<header class="lt-barra">
  <div class="lt-izq">
    <a class="lt-btn lt-volver" href="/cuenta.html" title="Volver a mi cuenta" aria-label="Volver a mi cuenta">←</a>
    <button class="lt-btn" id="lt-panel" title="Índice y marcadores" aria-label="Índice y marcadores" aria-expanded="false">☰</button>
    <div class="lt-titulo"><b id="lt-titulo">Cargando…</b><small>Joel Ortega Juárez</small></div>
  </div>
  <div class="lt-centro">
    <button class="lt-btn" id="lt-ant" title="Página anterior (←)" aria-label="Página anterior">‹</button>
    <label class="lt-pag"><input id="lt-num" inputmode="numeric" value="1" aria-label="Página actual"><span>/ <i id="lt-total">–</i></span></label>
    <button class="lt-btn" id="lt-sig" title="Página siguiente (→)" aria-label="Página siguiente">›</button>
  </div>
  <div class="lt-der">
    <button class="lt-btn" id="lt-menos" title="Alejar (−)" aria-label="Alejar">−</button>
    <button class="lt-zoom" id="lt-zoom" title="Ajustar al ancho">100%</button>
    <button class="lt-btn" id="lt-mas" title="Acercar (+)" aria-label="Acercar">+</button>
    <span class="lt-sep"></span>
    <button class="lt-btn lt-tema" id="lt-tema" title="Tema de lectura: claro, sepia, noche" aria-label="Cambiar tema">◐</button>
    <button class="lt-btn" id="lt-marca" title="Marcar esta página" aria-label="Marcar página" aria-pressed="false">🔖</button>
    <button class="lt-btn lt-solo-ancho" id="lt-pantalla" title="Pantalla completa" aria-label="Pantalla completa">⛶</button>
    <a class="lt-descargar" id="lt-descargar" href="#">Descargar PDF</a>
  </div>
  <div class="lt-progreso"><i id="lt-progreso"></i></div>
</header>

<aside class="lt-lateral" id="lt-lateral" hidden>
  <div class="lt-tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="indice">Índice</button>
    <button role="tab" aria-selected="false" data-tab="marcas">Marcadores</button>
  </div>
  <nav id="lt-indice" class="lt-lista"></nav>
  <nav id="lt-marcas" class="lt-lista" hidden></nav>
</aside>

<main class="lt-escena" id="lt-escena" tabindex="0">
  <section class="lt-dedicatoria" id="lt-dedicatoria" hidden>
    <small>Ejemplar dedicado</small>
    <h1 id="lt-ded-libro"></h1>
    <em id="lt-ded-para"></em>
    <p id="lt-ded-texto"></p>
    <img id="lt-ded-firma" alt="Firma de Joel Ortega Juárez" hidden>
    <span class="lt-ded-linea"></span>
    <span class="lt-ded-autor">Joel Ortega Juárez</span>
    <span class="lt-ded-fecha" id="lt-ded-fecha"></span>
  </section>
  <div id="lt-paginas" class="lt-paginas"></div>
  <div class="lt-estado" id="lt-estado">
    <div class="lt-cargando"><span></span><p id="lt-mensaje">Abriendo el libro…</p></div>
  </div>
</main>
<script src="/assets/lector.js"></script>
</body>
</html>
